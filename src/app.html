<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2C2430" />
		<link rel="icon" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
		/>
		<script>
			// Desktop-sized windows open the home page on the village map. Flag it before
			// first paint; the query must match the one in src/routes/+page.svelte.
			if (matchMedia('(min-width: 820px) and (min-height: 480px)').matches) {
				document.documentElement.dataset.home = 'map';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
